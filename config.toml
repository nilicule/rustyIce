[server]
stream_bind = "0.0.0.0:8000"
admin_bind  = "127.0.0.1:8001"
hostname    = "localhost"

[logging]
level  = "info"
format = "pretty"

[auth]
# Optional: a global source password. Any source authenticating with it may
# create a dynamic mount on a path not listed in [[mounts]] below. The mount
# is removed automatically when the source disconnects.
source_password = "letmesource"

[[auth.users]]
username        = "admin"
# bcrypt of "adminpass" — regenerate: htpasswd -bnBC 12 "" adminpass | tr -d ':\n'
password_bcrypt = "$2y$12$tWRporih5P9huFKMLo7ozO.9WvKgTRlQBFRlF8Y4AsGglyRY7qvr."

[transcode]
format       = "mp3"        # "mp3" or "vorbis"
sample_rate  = 44100
bitrate_kbps = 128

[limits]
max_listeners_global  = 500
ring_size             = 64
slow_listener_grace_s = 2
# Burst-on-connect: bytes of recent audio sent to each new listener so players
# can start playback immediately instead of waiting for live data. Set to 0
# to disable. Per-mount override available as [[mounts]] burst_size.
burst_size            = 65536
# Uncomment to cap source ingest rate. Useful when pushing files with curl so
# the connection stays open at real-time bitrate instead of uploading instantly.
# source_max_kbps = 128

[[autodjs]]
mount         = "/auto"
name          = "AutoDJ"
description   = "24/7 techno channel"
genre         = "Techno"
folder        = "/Users/remco/Music/Singles/Techno and House"
enabled       = true
loop          = true                # restart playlist when it ends
order         = "shuffle"           # or "sequential"

[autodjs.transcode]
format       = "mp3"
sample_rate  = 44100
bitrate_kbps = 128

[[mounts]]
path = "/stream2"
source_password = "johnjohn"
max_listeners = 128
name = "Name 2"
description = "This is my desc 2"
genre = "house"

[mounts.transcode]
format = "mp3"
sample_rate = 44100
bitrate_kbps = 128

[[mounts]]
path = "/stream3"
source_password = "nopassword"
max_listeners = 128
name = "This is a name"
description = "Descriptioooon"
genre = "Techno"
