[workspace]
members = [
    "crates/rustyice-core",
    "crates/rustyice-codec",
    "crates/rustyice-auth",
    "crates/rustyice-ingest",
    "crates/rustyice-output",
    "crates/rustyice-admin",
    "crates/rustyice-server",
    "crates/rustyice-transcode",
    "crates/rustyice-loadtest",
    "crates/rustyice-autodj",
]
# The loadtest crate is excluded from default builds so `cargo build --release`
# never links it into the production binary. Run it explicitly with
# `cargo run --release -p rustyice-loadtest`.
default-members = [
    "crates/rustyice-core",
    "crates/rustyice-codec",
    "crates/rustyice-auth",
    "crates/rustyice-ingest",
    "crates/rustyice-output",
    "crates/rustyice-admin",
    "crates/rustyice-server",
    "crates/rustyice-transcode",
    "crates/rustyice-autodj",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2024"

[workspace.dependencies]
tokio        = { version = "1",    features = ["full"] }
tokio-util   = { version = "0.7",  features = ["codec", "io"] }
axum         = "0.8"
tower        = { version = "0.5",  features = ["full"] }
tower-http   = { version = "0.6",  features = ["trace", "cors"] }
http         = "1"
serde        = { version = "1",    features = ["derive"] }
toml         = "1.1.2"
toml_edit    = "0.22"
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics      = "0.24.6"
metrics-exporter-prometheus = "0.18.3"
bcrypt       = "0.19.1"
rust-embed   = { version = "8",    features = ["debug-embed"] }
mime_guess   = "2"
arc-swap     = "1"
bytes        = "1"
thiserror    = "2"
async-trait  = "0.1"
futures      = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
serde_json   = "1"
base64       = "0.22"
httparse     = "1"
hyper        = { version = "1", features = ["server", "http1"] }
hyper-util   = { version = "0.1", features = ["tokio", "server", "server-graceful", "http1", "service"] }
tempfile     = "3"
reqwest      = { version = "0.13.3", features = ["stream", "json"] }
uuid         = { version = "1",    features = ["v4"] }
symphonia    = { version = "0.5", default-features = false, features = ["mp3", "vorbis", "ogg"] }
rubato       = "0.15"
mp3lame-sys  = "0.1"
vorbis_rs    = "0.5"
lofty        = "0.22"
walkdir      = "2"
rand         = { version = "0.8", features = ["std_rng"] }
id3          = "1"

# ── Release profile ────────────────────────────────────────────────────────
# Tuned for smaller production binaries without hurting throughput.
#  - lto = "fat" lets LLVM optimize across crate boundaries (biggest size win)
#  - codegen-units = 1 trades parallel compile speed for tighter codegen
#  - strip = "symbols" drops debug symbols / function names from the binary
#
# Kept off (would reduce size further but at a real cost):
#  - opt-level = "z" / "s": smaller, but can hurt stream-encoding hot paths.
#  - panic = "abort": ~15-20% size cut but Tokio task panics stop propagating
#    via JoinHandle, and any `catch_unwind` in deps becomes a no-op.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

# Release-with-debug profile for profiling: same speed-shaped optimizations
# but keep debug info so perf / Instruments / dtrace see real names.
[profile.release-debuginfo]
inherits = "release"
strip = "none"
debug = true
