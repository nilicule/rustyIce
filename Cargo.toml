[workspace]
members = [
    "crates/rustyice-core",
    "crates/rustyice-codec",
    "crates/rustyice-auth",
    "crates/rustyice-ingest",
    "crates/rustyice-output",
    "crates/rustyice-admin",
    "crates/rustyice-server",
    "crates/rustyice-transcode",
    "crates/rustyice-loadtest",
    "crates/rustyice-autodj",
]
# The loadtest crate is excluded from default builds so `cargo build --release`
# never links it into the production binary. Run it explicitly with
# `cargo run --release -p rustyice-loadtest`.
default-members = [
    "crates/rustyice-core",
    "crates/rustyice-codec",
    "crates/rustyice-auth",
    "crates/rustyice-ingest",
    "crates/rustyice-output",
    "crates/rustyice-admin",
    "crates/rustyice-server",
    "crates/rustyice-transcode",
    "crates/rustyice-autodj",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2024"

[workspace.dependencies]
tokio        = { version = "1",    features = ["full"] }
tokio-util   = { version = "0.7",  features = ["codec", "io"] }
axum         = "0.8"
tower        = { version = "0.5",  features = ["full"] }
tower-http   = { version = "0.6",  features = ["trace", "cors"] }
http         = "1"
serde        = { version = "1",    features = ["derive"] }
toml         = "1.1.2"
toml_edit    = "0.22"
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics      = "0.24.6"
metrics-exporter-prometheus = "0.18.3"
bcrypt       = "0.19.1"
rust-embed   = { version = "8",    features = ["debug-embed"] }
mime_guess   = "2"
arc-swap     = "1"
bytes        = "1"
thiserror    = "2"
async-trait  = "0.1"
futures      = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
serde_json   = "1"
base64       = "0.22"
httparse     = "1"
hyper        = { version = "1", features = ["server", "http1"] }
hyper-util   = { version = "0.1", features = ["tokio", "server", "server-graceful", "http1", "service"] }
tempfile     = "3"
reqwest      = { version = "0.13.3", features = ["stream", "json"] }
uuid         = { version = "1",    features = ["v4"] }
symphonia    = { version = "0.5", default-features = false, features = ["mp3", "vorbis", "ogg"] }
rubato       = "0.15"
mp3lame-sys  = "0.1"
vorbis_rs    = "0.5"
lofty        = "0.22"
walkdir      = "2"
rand         = { version = "0.8", features = ["std_rng"] }
id3          = "1"

# ── Release profiles ───────────────────────────────────────────────────────
# `release`            — fast local iteration; cargo defaults.
# `release-dist`       — distribution build with cross-crate optimization
#                        and stripped symbols. CI uses this for release
#                        artifacts; run locally with
#                        `cargo build --profile release-dist`.
# `release-debuginfo`  — release optimizations but keep debug info so
#                        perf / Instruments / dtrace see real symbol names.
#
# Why `lto = "thin"` (not `"fat"`):
#   Thin LTO summarizes each crate's IR and lets the optimizer make
#   cross-crate inlining / dead-code decisions from those summaries
#   without merging everything into one giant module. Almost as good
#   for size and speed as fat LTO, but the link is dramatically
#   faster (typically 2-3×) — important for CI build times.
#
# Why `codegen-units = 1`:
#   Forces a single LLVM module per crate before LTO, which gives the
#   optimizer the largest possible scope to make decisions. Slightly
#   slower compile, tighter codegen.
#
# Not enabled in either profile:
#  - opt-level = "z" / "s": smaller, but can pessimize the stream-
#    encoding hot paths (mp3lame / Vorbis encode loops).
#  - panic = "abort": another ~15-20% cut, but Tokio task panics stop
#    propagating via JoinHandle and any `catch_unwind` in deps no-ops.

[profile.release-dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.release-debuginfo]
inherits = "release"
debug = true
